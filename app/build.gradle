// EL TRUCO DEFINITIVO SEGURO: Espera de forma dinámica a que Android cree la tarea antes de inyectar el XML
tasks.whenTaskAdded { task ->
    if (task.name == "preBuild") {
        task.doFirst {
            def manifestFile = file("src/main/AndroidManifest.xml")
            manifestFile.parentFile.mkdirs()
            manifestFile.text = """<?xml version='1.0' encoding='utf-8'?>
<manifest xmlns:android='http://android.com'>
    <application
        android:allowBackup='true'
        android:label='Climb App'
        android:supportsRtl='true'
        android:theme='@style/Theme.AppCompat.NoActionBar'>
        <activity 
            android:name='com.example.climb.MainActivity'
            android:exported='true'>
            <intent-filter>
                <action android:name='android.intent.action.MAIN' />
                <category android:name='android.intent.category.LAUNCHER' />
            </intent-filter>
        </activity>
    </application>
</manifest>"""
            println("¡AndroidManifest.xml inyectado de forma dinámica y segura!")
        }
    }
}
