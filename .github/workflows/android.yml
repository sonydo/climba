name: Generar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle en el servidor
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Generar el archivo ejecutable gradlew
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Compilar el archivo APK (Debug rápido)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: ./gradlew :app:assembleDebug --no-daemon

    - name: Subir el archivo APK generado a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: climb-app-debug-apk
        path: "app/build/outputs/apk/**/*.apk"
