name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Forzar permisos del ejecutable Gradle
      # Esto soluciona el error de "No such file" asegurando que Git reconozca el archivo gradlew como un ejecutable real
      run: |
        git update-index --chmod=+x gradlew || true
        chmod +x ./gradlew

    - name: Compilar APK (Inyectando API Key)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: ./gradlew :app:assembleDebug --no-daemon

    - name: Subir APK como artefacto de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: climb-app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
